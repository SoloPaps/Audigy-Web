# Supabase LOCAL uniquement. Aucun projet distant, aucune clé réelle.
# Les jetons de dev sont générés par la CLI dans supabase/.temp (ignoré par git).

project_id = "audigy"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
# Les GRANT sont explicites dans les migrations.
auto_expose_new_tables = false

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[storage.analytics]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:8888"
additional_redirect_urls = ["http://127.0.0.1:8888", "http://127.0.0.1:4321"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8

[auth.rate_limit]
email_sent = 100
sms_sent = 0
anonymous_users = 0
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 8
otp_expiry = 3600

[auth.email.template.magic_link]
subject = "Votre lien de connexion Audigy"
content_path = "./supabase/templates/magic_link.html"

[auth.sms]
enable_signup = false
enable_confirmations = false

[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[edge_runtime]
enabled = false

[analytics]
enabled = false

[experimental.pgdelta]
enabled = false
