<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audixio — Navigation Bar Flottante</title>
    <style>
        /* ==========================================================================
           1. CHARTE GRAPHIQUE AUDIXIO (Variables CSS Sync avec la Palette)
           ========================================================================== */
        :root[data-theme="light"] {
            --bg-page: #EDE8F5;            /* Fond doux de la page */
            --nav-bg: rgba(255, 255, 255, 0.82); /* Verre dépoli clair */
            --nav-border: #ADBBDA;        /* Bordures légères */
            --primary: #3D52A0;           /* Bleu primaire (Logo, BTN principal) */
            --accent: #7091E6;            /* Accent lumineux / Glows */
            --pill-active: rgba(61, 82, 160, 0.08); /* Fond de l'onglet actif */
            --text-main: #1E2A55;         /* Texte encre */
            --text-muted: #4A5585;        /* Texte secondaire */
            --shadow-nav: 0 20px 40px -15px rgba(61, 82, 160, 0.15), 0 0 1px rgba(61, 82, 160, 0.2);
        }

        :root[data-theme="dark"] {
            --bg-page: #0B1021;            /* Fond sombre abysse */
            --nav-bg: rgba(18, 25, 48, 0.85);  /* Verre dépoli sombre */
            --nav-border: rgba(112, 145, 230, 0.25);
            --primary: #7091E6;           /* Bleu vibrant pour ressortir du sombre */
            --accent: #8697C4;
            --pill-active: rgba(112, 145, 230, 0.15);
            --logo-ink: #ADBBDA;
            --text-main: #EDE8F5;
            --text-muted: #ADBBDA;
            --shadow-nav: 0 25px 50px -15px rgba(0, 0, 0, 0.7), 0 0 20px rgba(112, 145, 230, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s ease, border-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 32px;
            overflow-x: hidden;
        }

        /* Effet d'ambiance lumineuse derrière la navbar */
        .ambient-glow {
            position: absolute;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 300px;
            background: radial-gradient(circle, var(--accent) 0%, rgba(0,0,0,0) 70%);
            opacity: 0.18;
            filter: blur(60px);
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================================================
           2. NAVIGATION BAR CENTRÉE & FLOTTANTE
           ========================================================================== */
        .navbar-wrapper {
            position: fixed;
            top: 24px;
            z-index: 1000;
            display: flex;
            justify-content: center;
            width: 100%;
            padding: 0 16px;
        }

        .navbar {
            position: relative;
            display: flex;
            align-items: center;
            gap: 28px;
            padding: 8px 12px 8px 18px;
            background: var(--nav-bg);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--nav-border);
            border-radius: 99px; /* Forme capsule moderne */
            box-shadow: var(--shadow-nav);
            animation: navbarEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes navbarEntrance {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Logo Brand Audixio */
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -0.4px;
            padding-right: 8px;
        }

        .brand-logo-icon {
            width: 28px;
            height: 28px;
            color: var(--logo-ink, #3D52A0);
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .brand:hover .brand-logo-icon {
            transform: rotate(45deg) scale(1.1);
        }

        /* Liens de navigation */
        .nav-links {
            position: relative;
            display: flex;
            align-items: center;
            gap: 4px;
            list-style: none;
        }

        .nav-link {
            position: relative;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 99px;
            z-index: 2;
            transition: color 0.25s ease;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
        }

        /* Indicator Glissant / Pilule d'arrière-plan */
        .nav-indicator {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            background: var(--pill-active);
            border-radius: 99px;
            z-index: 1;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            pointer-events: none;
        }

        /* Séparateur subtil */
        .divider {
            width: 1px;
            height: 20px;
            background-color: var(--nav-border);
            opacity: 0.6;
        }

        /* Actions Droite (Theme Switch + Compte) */
        .nav-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Switch Langue FR / EN */
        .lang-toggle {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--nav-border);
            border-radius: 99px;
        }

        .lang-btn {
            background: none;
            border: none;
            font-family: inherit;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 9px;
            border-radius: 99px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .lang-btn:hover, .lang-btn[aria-pressed="true"] {
            color: var(--primary);
        }

        .lang-btn[aria-pressed="true"] {
            background-color: var(--pill-active);
        }

        /* Bouton Theme Switch (Clair / Sombre) */
        .theme-toggle-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s, transform 0.2s;
        }

        .theme-toggle-btn:hover {
            background-color: var(--pill-active);
            color: var(--primary);
            transform: scale(1.08);
        }

        /* Bouton Compte CTA */
        .account-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: #FFFFFF;
            text-decoration: none;
            padding: 8px 18px 8px 14px;
            border-radius: 99px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 14px rgba(61, 82, 160, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        }

        .account-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(61, 82, 160, 0.35);
            filter: brightness(1.08);
        }

        .account-avatar {
            width: 24px;
            height: 24px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Démo Contenu de Page */
        .demo-content {
            margin-top: 180px;
            text-align: center;
            max-width: 600px;
            padding: 0 20px;
            z-index: 1;
        }

        .demo-content h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            color: var(--text-main);
        }

        .demo-content p {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
        }
    </style>
</head>

    <!-- Zone Démo -->
    <main class="demo-content">
        <h1>Audixio Studio</h1>
        <p>Explorez la santé technique, la sécurité et la conformité de vos plateformes web avec une interface fluide et réactive.</p>
    </main>

    <script>
        // --- 1. Gestion du Switch Mode Clair / Mode Sombre ---
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const html = document.documentElement;

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            
            html.setAttribute('data-theme', newTheme);
            
            if (newTheme === 'dark') {
                // Icône Soleil pour basculer vers le Clair
                themeIcon.innerHTML = `<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
            } else {
                // Icône Lune pour basculer vers le Sombre
                themeIcon.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;
            }
        });

        // --- 2. Animation de la Pilule Glissante (Nav Indicator) ---
        const navLinks = document.querySelectorAll('.nav-link');
        const indicator = document.getElementById('navIndicator');

        function moveIndicator(element) {
            if (!element) return;
            const rect = element.getBoundingClientRect();
            const parentRect = element.parentElement.parentElement.getBoundingClientRect();
            
            indicator.style.width = `${rect.width}px`;
            indicator.style.left = `${rect.left - parentRect.left}px`;
            indicator.style.opacity = '1';
        }

        // Initialisation sur le lien actif
        const activeLink = document.querySelector('.nav-link.active');
        if (activeLink) {
            moveIndicator(activeLink);
        }

        // Effets au survol et au clic
        navLinks.forEach(link => {
            link.addEventListener('mouseenter', (e) => moveIndicator(e.target));
            
            link.addEventListener('click', (e) => {
                navLinks.forEach(l => l.classList.remove('active'));
                e.target.classList.add('active');
                moveIndicator(e.target);
            });
        });

        document.getElementById('navLinks').addEventListener('mouseleave', () => {
            const currentActive = document.querySelector('.nav-link.active');
            if (currentActive) {
                moveIndicator(currentActive);
            } else {
                indicator.style.opacity = '0';
            }
        });
        // --- 3. Switch Langue FR / EN ---
        const langBtns = document.querySelectorAll('.lang-btn');
        langBtns.forEach(btn => btn.addEventListener('click', () => {
            langBtns.forEach(b => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
        }));
    </script>
