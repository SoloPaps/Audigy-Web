<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Partager le rapport | Audixio</title>
<meta name="theme-color" content="#3D52A0">
<meta name="color-scheme" content="light">
<!-- Modale : pas de navbar ni de footer. Fond = rapport flouté. Aucune ressource externe. -->
<style>
:root{--primary:#3D52A0;--primary-h:#1E2A55;--accent:#7091E6;--sec:#8697C4;--line:#ADBBDA;--bg:#EDE8F5;--text:#1E2A55;--muted:#4A5585;--ok:#067647;--err:#B42318}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);overflow:hidden;line-height:1.5}
.ico{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.backdrop{position:fixed;inset:0;z-index:0}
.backdrop iframe{width:100%;height:100%;border:0;filter:blur(10px) saturate(1.05);transform:scale(1.04);pointer-events:none}
.veil{position:fixed;inset:0;z-index:1;background:rgba(30,42,85,.38);animation:fd .35s ease both}
@keyframes fd{from{opacity:0}}
.wrap{position:fixed;inset:0;z-index:2;display:flex;padding:16px;overflow:auto}
.dlg{position:relative;margin:auto;width:100%;max-width:560px;background:rgba(255,255,255,.96);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 70px -24px rgba(30,42,85,.55);padding:28px;overflow:hidden;animation:up .55s cubic-bezier(.16,1,.3,1) both}
.dlg::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--primary),var(--accent),var(--sec),var(--primary));background-size:300% 100%;animation:flow 6s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(30px) scale(.98)}}
@keyframes flow{to{background-position:300% 0}}
.hd{display:flex;gap:14px;align-items:flex-start;padding-right:48px}
.ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--bg);color:var(--primary);animation:bob 3.5s ease-in-out infinite}
.ic svg{width:24px;height:24px}
@keyframes bob{50%{transform:translateY(-3px) rotate(-6deg)}}
h1{font-size:21px;font-weight:800;letter-spacing:-.01em}
.hd p{font-size:15px;color:var(--muted);margin-top:4px}
.x{position:absolute;top:16px;right:16px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:#fff;border:1px solid var(--line);text-decoration:none;transition:background .2s,color .2s}
.x:hover{background:var(--bg);color:var(--text)}.x svg{width:20px;height:20px}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.lbl{display:block;font-weight:700;font-size:14px;margin:22px 0 6px}
.copy{display:flex;gap:8px}
.inp{flex:1;min-width:0;min-height:48px;padding:10px 14px;border:1px solid var(--sec);border-radius:12px;background:#fff;font:14px/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 15px/1 Inter,system-ui,sans-serif;min-height:48px;padding:0 18px;border-radius:12px;cursor:pointer;border:1.5px solid var(--primary);text-decoration:none;transition:background .2s,color .2s,transform .15s,box-shadow .2s}
.btn svg{width:18px;height:18px}.btn:active{transform:scale(.97)}
.b-main{background:var(--primary);color:#fff}.b-main:hover{background:var(--primary-h);border-color:var(--primary-h);box-shadow:0 8px 20px -8px rgba(61,82,160,.6)}
.b-main.done{background:var(--ok);border-color:var(--ok)}
.b-gh{background:#fff;color:var(--primary)}.b-gh:hover{background:var(--bg)}
.b-dz{background:#fff;color:var(--err);border-color:#F3B4B4}.b-dz:hover{background:#FEF3F2}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--bg);font-size:13px;font-weight:600;color:var(--muted)}
.pill.on{color:var(--ok);background:#ECFDF3}.pill.off{color:var(--err);background:#FEF3F2}
.pill svg{width:14px;height:14px}
select.inp{font-family:Inter,system-ui,sans-serif;font-size:15px;width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.lk{display:flex;align-items:center;gap:14px;margin-top:22px;min-height:44px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--text);text-decoration:none;transition:transform .25s cubic-bezier(.16,1,.3,1),border-color .25s,box-shadow .25s}
.lk:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:0 16px 32px -16px rgba(61,82,160,.45)}
.lk-ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--bg);color:var(--primary);display:grid;place-items:center}.lk-ico svg{width:22px;height:22px}
.lk b{display:block}.lk span span{display:block;font-size:14px;color:var(--muted)}.lk>span:nth-child(2){flex:1;min-width:0}
.lk .ar{width:20px;height:20px;color:var(--primary);flex:none;transition:transform .25s}.lk:hover .ar{transform:translateX(4px)}
.st{margin-top:12px;font-size:14px;font-weight:600;color:var(--ok)}
@media(max-width:480px){.dlg{padding:22px 16px}.copy{flex-direction:column}.row .btn{flex:1 1 100%}.hd{gap:10px}.ic{width:38px;height:38px}h1{font-size:19px}.x{top:12px;right:12px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="backdrop" aria-hidden="true"><iframe src="../page_rapport_hub/page_rapport_hub.html" tabindex="-1" title=""></iframe></div>
<div class="veil" aria-hidden="true"></div>
<div class="wrap"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="t" aria-describedby="d">
<a class="x" href="../page_rapport_hub/page_rapport_hub.html" aria-label="Fermer et revenir au rapport"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
<div class="hd"><span class="ic" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" focusable="false"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></span><div><h1 id="t">Partager le rapport</h1><p id="d">Toute personne disposant du lien peut consulter le rapport de <b>monsite-exemple.fr</b>, sans compte.</p></div></div>
<label class="lbl" for="url">Lien public</label>
<div class="copy"><input class="inp" id="url" readonly value="https://audixio.fr/r/k7Qm2xVa"><button class="btn b-main" type="button" id="cp"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg><span>Copier le lien</span></button></div>
<div class="meta"><span class="pill on" id="state"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 6 9 17l-5-5"/></svg><span>Lien actif</span></span><span class="pill"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="exp">Expire le 29 nov. 2026</span></span></div>
<label class="lbl" for="dur">Durée de validité</label>
<select class="inp" id="dur"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="90">90 jours</option><option value="0">Sans expiration</option></select>
<div class="row" id="nsRow" hidden><button class="btn b-main" type="button" id="ns"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg><span>Partager via…</span></button></div>
<div class="row"><button class="btn b-gh" type="button" id="new"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg><span>Créer un nouveau lien</span></button><button class="btn b-dz" type="button" id="rev"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M18 6 6 18M6 6l12 12"/></svg><span>Révoquer le lien</span></button></div>
<p class="st" id="st" role="status" aria-live="polite" hidden></p>
<a class="lk" href="../interface_badge_partage/interface_badge_partage.html"><span class="lk-ico" aria-hidden="true"><svg class="ico" viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-3 5 3-1.5-7"/></svg></span><span><b>Intégrer le badge Audixio</b><span>Affichez votre note sur votre site.</span></span><svg class="ico ar" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</div></div>
<script>
(function(){
var $=function(s){return document.getElementById(s)},url=$('url'),cp=$('cp'),st=$('st'),active=true;
function msg(m){st.hidden=false;st.textContent=m}
function setActive(a){active=a;var s=$('state');s.className='pill '+(a?'on':'off');s.lastChild.textContent=a?'Lien actif':'Lien révoqué';cp.disabled=!a;url.style.textDecoration=a?'none':'line-through';$('rev').disabled=!a}
cp.addEventListener('click',function(){url.select();var done=function(){cp.classList.add('done');cp.lastChild.textContent='Lien copié';msg('Lien copié dans le presse-papiers.');setTimeout(function(){cp.classList.remove('done');cp.lastChild.textContent='Copier le lien'},2200)};if(navigator.clipboard)navigator.clipboard.writeText(url.value).then(done,done);else done()});
$('dur').addEventListener('change',function(){var n=+this.value;if(!n){$('exp').textContent='Sans expiration'}else{var d=new Date(2026,9,30);d.setDate(d.getDate()+n);$('exp').textContent='Expire le '+d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}msg('Durée mise à jour.')});
$('new').addEventListener('click',function(){var c='abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<8;i++)s+=c[Math.floor(Math.random()*c.length)];url.value='https://audixio.fr/r/'+s;setActive(true);msg('Nouveau lien créé. L’ancien ne fonctionne plus.')});
$('rev').addEventListener('click',function(){setActive(false);msg('Lien révoqué : plus personne ne peut ouvrir le rapport avec ce lien.')});
document.addEventListener('keydown',function(e){if(e.key==='Escape')location.href='../page_rapport_hub/page_rapport_hub.html'});
document.querySelector('.dlg').focus&&cp.focus();
})();
</script>
<script>/* Mobile + navigator.share : bouton « Partager via… » (feuille native) ; desktop : modale seule. */
(function(){var r=document.getElementById('nsRow'),b=document.getElementById('ns'),u=document.getElementById('url');
if(!navigator.share||!matchMedia('(pointer:coarse)').matches)return;r.hidden=false;
b.addEventListener('click',function(){navigator.share({title:'Rapport Audixio',url:u.value}).catch(function(){});});})();</script>
</body>
</html>
