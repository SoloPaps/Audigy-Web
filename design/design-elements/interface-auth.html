<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audixio — Authentification Pro (Mode Clair)</title>
    <style>
        :root {
            /* Mode Clair (Forcé par défaut) */
            --bg-page-start: #FAF8F4;
            --bg-page-end: #EBF3F8;
            --surface-card: rgba(255, 255, 255, 0.88);
            --surface-input: #F8FAFC;
            --border-card: rgba(15, 92, 90, 0.15);
            --border-input: #CBD5E1;
            
            --petrol-dark: #0F5C5A;
            --petrol: #2A9B96;
            --petrol-hover: #1F7D79;
            --peach-soft: #F3C7B4;
            --peach-focus: #C2410C;
            
            --text-main: #0F172A;
            --text-muted: #64748B;
            --text-inverse: #FFFFFF;
            
            --card-shadow: 0 30px 60px -15px rgba(15, 92, 90, 0.15), 0 0 1px 1px rgba(15, 92, 90, 0.05);
            --input-focus-shadow: 0 0 0 4px rgba(15, 92, 90, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        border-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-page-start), var(--bg-page-end));
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
            perspective: 1000px;
        }

        /* --- ORBES LUMINEUX ANIMÉS --- */
        .ambient-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(42, 155, 150, 0.12) 0%, rgba(243, 199, 180, 0.08) 50%, transparent 70%);
            top: -150px;
            left: -150px;
            z-index: 0;
            animation: floatOrb 12s ease-in-out infinite alternate;
            pointer-events: none;
        }

        .ambient-glow-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(243, 199, 180, 0.15) 0%, rgba(42, 155, 150, 0.04) 60%, transparent 80%);
            bottom: -150px;
            right: -150px;
            z-index: 0;
            animation: floatOrb 15s ease-in-out infinite alternate-reverse;
            pointer-events: none;
        }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.1); }
            100% { transform: translate(-40px, 80px) scale(0.95); }
        }

        /* --- CARTE PRINCIPALE AVEC EFFET TILT 3D --- */
        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: var(--surface-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-card);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: var(--card-shadow);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.4s ease;
            animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardEntrance {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Liseré supérieur signature Audixio dégradé animé */
        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            background: linear-gradient(90deg, var(--petrol-dark), var(--petrol), var(--peach-soft), var(--petrol-dark));
            background-size: 300% 100%;
            animation: gradientShift 6s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
        }

        .brand-header h1 span {
            color: var(--petrol-dark);
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* --- SYSTÈMES DE TABS GLISSANTS --- */
        .tabs-nav {
            position: relative;
            display: flex;
            background: var(--surface-input);
            border: 1px solid var(--border-card);
            border-radius: 14px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab-indicator {
            position: absolute;
            top: 4px;
            left: 4px;
            width: calc(50% - 4px);
            height: calc(100% - 8px);
            background: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(15, 92, 90, 0.1);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1;
        }

        .tab-btn {
            flex: 1;
            position: relative;
            background: none;
            border: none;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .tab-btn.active {
            color: var(--text-main);
        }

        /* Vues formulaires */
        .form-view {
            display: none;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .form-view.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        /* Boutons de connexion sociale */
        .social-grid {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: var(--surface-input);
            border: 1px solid var(--border-card);
            color: var(--text-main);
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .social-btn:hover {
            border-color: var(--petrol-dark);
            background: #FFFFFF;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(15, 92, 90, 0.08);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin-bottom: 24px;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-card);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        /* Champs de saisie */
        .field-group {
            margin-bottom: 18px;
        }

        .field-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .field-input {
            width: 100%;
            background: var(--surface-input);
            border: 1px solid var(--border-input);
            border-radius: 12px;
            padding: 13px 16px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.25s ease;
        }

        .field-input:focus {
            border-color: var(--petrol-dark);
            box-shadow: var(--input-focus-shadow);
            background: #FFFFFF;
        }

        .btn-eye {
            position: absolute;
            right: 14px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            transition: color 0.2s;
        }

        .btn-eye:hover {
            color: var(--peach-focus);
        }

        /* Indicateur de force */
        .strength-meter {
            height: 5px;
            width: 100%;
            background: var(--border-card);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.4s ease;
            border-radius: 3px;
        }

        .strength-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            text-align: right;
            font-weight: 500;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            font-size: 13px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            cursor: pointer;
        }

        .checkbox-label input {
            accent-color: var(--petrol-dark);
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        .link-accent {
            color: var(--peach-focus);
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .link-accent:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* --- BOUTON CTA PRINCIPAL AVEC SHIMMER --- */
        .btn-cta {
            position: relative;
            width: 100%;
            background: linear-gradient(135deg, var(--petrol-dark), var(--petrol));
            color: var(--text-inverse);
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(15, 92, 90, 0.25);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease;
        }

        .btn-cta::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(60deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(30deg) translateX(-100%);
            transition: transform 0.8s ease-in-out;
        }

        .btn-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 92, 90, 0.35);
        }

        .btn-cta:hover::after {
            transform: rotate(30deg) translateX(100%);
        }

        .btn-cta:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <!-- Orbes lumineux d'ambiance -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <div class="auth-card" id="authCard">
        <div class="brand-header">
            <h1>Audixio<span>.</span></h1>
            <p id="headerSubtitle">Accédez à votre espace d'audit web sécurisé</p>
        </div>

        <!-- Système de Tabs -->
        <div class="tabs-nav">
            <div class="tab-indicator" id="tabIndicator"></div>
            <button class="tab-btn active" onclick="switchTab('login')">Se connecter</button>
            <button class="tab-btn" onclick="switchTab('signup')">S'inscrire</button>
        </div>

        <!-- ==================== VUE 1 : CONNEXION ==================== -->
        <div class="form-view active" id="loginView">
            <div class="social-grid">
                <button class="social-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.18 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.5-.38-2.25s.13-1.53.38-2.25V6.6H1.2C.44 8.14 0 9.99 0 12s.44 3.86 1.2 5.4l4.08-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.68 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
                    Google
                </button>
                <button class="social-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#0F172A"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </button>
            </div>

            <div class="divider">ou e-mail</div>

            <form onsubmit="handleSubmit(event, 'Connexion')">
                <div class="field-group">
                    <label class="field-label" for="loginEmail">Adresse e-mail</label>
                    <div class="input-container">
                        <input class="field-input" type="email" id="loginEmail" placeholder="nom@exemple.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="loginPassword">Mot de passe</label>
                    <div class="input-container">
                        <input class="field-input" type="password" id="loginPassword" placeholder="••••••••••••" required>
                        <button type="button" class="btn-eye" onclick="togglePass('loginPassword', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox"> Se souvenir de moi
                    </label>
                    <a href="#" class="link-accent">Oublié ?</a>
                </div>

                <button class="btn-cta" type="submit">Se connecter</button>
            </form>
        </div>

        <!-- ==================== VUE 2 : INSCRIPTION ==================== -->
        <div class="form-view" id="signupView">
            <div class="social-grid">
                <button class="social-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.15C3.18 21.32 7.23 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.5-.38-2.25s.13-1.53.38-2.25V6.6H1.2C.44 8.14 0 9.99 0 12s.44 3.86 1.2 5.4l4.08-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.18 2.68 1.2 6.6l4.08 3.15c.95-2.84 3.6-4.95 6.72-4.95z"/></svg>
                    Google
                </button>
                <button class="social-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="#0F172A"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                    GitHub
                </button>
            </div>

            <div class="divider">ou e-mail</div>

            <form onsubmit="handleSubmit(event, 'Inscription')">
                <div class="field-group">
                    <label class="field-label" for="signupEmail">Adresse e-mail</label>
                    <div class="input-container">
                        <input class="field-input" type="email" id="signupEmail" placeholder="nom@exemple.com" required>
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="signupPassword">Mot de passe</label>
                    <div class="input-container">
                        <input class="field-input" type="password" id="signupPassword" placeholder="Créer un mot de passe" oninput="checkStrength(this.value)" required>
                        <button type="button" class="btn-eye" onclick="togglePass('signupPassword', this)">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                    <div class="strength-meter"><div class="strength-bar" id="strengthBar"></div></div>
                    <div class="strength-text" id="strengthText">Saisissez un mot de passe</div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" required> J'accepte les CGU d'Audixio
                    </label>
                </div>

                <button class="btn-cta" type="submit">Créer mon compte</button>
            </form>
        </div>
    </div>

    <script>
        // Gestion des Tabs avec la pillule glissante
        function switchTab(view) {
            const tabs = document.querySelectorAll('.tab-btn');
            const indicator = document.getElementById('tabIndicator');
            const loginView = document.getElementById('loginView');
            const signupView = document.getElementById('signupView');
            const subtitle = document.getElementById('headerSubtitle');

            tabs.forEach(tab => tab.classList.remove('active'));

            if (view === 'login') {
                tabs[0].classList.add('active');
                indicator.style.transform = 'translateX(0%)';
                signupView.classList.remove('active');
                setTimeout(() => {
                    signupView.style.display = 'none';
                    loginView.style.display = 'block';
                    setTimeout(() => loginView.classList.add('active'), 15);
                }, 200);
                subtitle.innerText = "Accédez à votre espace d'audit web sécurisé";
            } else {
                tabs[1].classList.add('active');
                indicator.style.transform = 'translateX(100%)';
                loginView.classList.remove('active');
                setTimeout(() => {
                    loginView.style.display = 'none';
                    signupView.style.display = 'block';
                    setTimeout(() => signupView.classList.add('active'), 15);
                }, 200);
                subtitle.innerText = "Rejoignez Audixio en quelques secondes";
            }
        }

        // Effet 3D Tilt interactif sur la carte
        const card = document.getElementById('authCard');
        document.addEventListener('mousemove', (e) => {
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });

        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
            card.style.transition = 'transform 0.5s ease';
        });

        card.addEventListener('mouseenter', () => {
            card.style.transition = 'none';
        });

        // Affichage / Masquage du mot de passe
        function togglePass(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
            } else {
                input.type = 'password';
                btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            }
        }

        // Testeur de force du mot de passe
        function checkStrength(password) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            let strength = 0;

            if (password.length > 5) strength += 25;
            if (password.match(/[A-Z]/)) strength += 25;
            if (password.match(/[0-9]/)) strength += 25;
            if (password.match(/[^A-Za-z0-9]/)) strength += 25;

            bar.style.width = strength + '%';

            if (strength === 0) {
                bar.style.backgroundColor = 'transparent';
                text.innerText = 'Saisissez un mot de passe';
            } else if (strength <= 25) {
                bar.style.backgroundColor = '#EF4444';
                text.innerText = 'Faible';
            } else if (strength <= 50) {
                bar.style.backgroundColor = '#F59E0B';
                text.innerText = 'Moyen';
            } else if (strength <= 75) {
                bar.style.backgroundColor = '#3B82F6';
                text.innerText = 'Bon';
            } else {
                bar.style.backgroundColor = '#10B981';
                text.innerText = 'Très fort';
            }
        }

        function handleSubmit(e, type) {
            e.preventDefault();
            alert(`${type} réussie avec succès !`);
        }
    </script>
</body>
</html>
