# Dev local uniquement. Aucun site lié, aucun déploiement (docs/dev/PLAN.md §14).
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[dev]
  port = 8888
  publish = "apps/web/dist"
  autoLaunch = false
  framework = "#static"

[functions]
  # Sources : netlify/functions. Bundle complet : pnpm build:functions.
  directory = "netlify/dist/functions"
  # Fiches de correction lues à l'exécution (effort des corrections).
  included_files = ["packages/engine/fixes/fr/*.md"]

# La sortie statique n’a pas une page par audit : le chemin réel reste dans le navigateur.
[[redirects]]
  from = "/rapport/:id/imprimer"
  to = "/rapport/imprimer/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    # CSP stricte (empreintes de scripts) :
    # scripts/publish-policy.ts écrit apps/web/dist/_headers au build.
    # Netlify donne priorité à ce fichier sur netlify.toml.

# Même page pour chaque identifiant. Le fichier existe seulement pour l’exemple.
[[redirects]]
  from = "/verifier/*"
  to = "/verifier/00000000-0000-4000-8000-000000000019/index.html"
  status = 200

[[redirects]]
  from = "/score/*"
  to = "/score/index.html"
  status = 200

[[redirects]]
  from = "/partage/*"
  to = "/partage/index.html"
  status = 200

[[headers]]
  for = "/partage/*"
  [headers.values]
    X-Robots-Tag = "noindex"
