# Dev local uniquement. Aucun site lié, aucun déploiement (docs/PLAN.md §14).
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[dev]
  port = 8888
  publish = "apps/web/dist"
  autoLaunch = false
  framework = "#static"

[functions]
  # Sources : netlify/functions. Bundle complet : pnpm build:functions.
  directory = "netlify/dist/functions"
  # Fiches de correction lues à l'exécution (effort des corrections).
  included_files = ["packages/engine/fixes/fr/*.md"]

# La sortie statique n’a pas une page par audit : le chemin réel reste dans le navigateur.
[[redirects]]
  from = "/rapport/:id/imprimer"
  to = "/rapport/imprimer/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Les îlots Astro/Svelte s’hydratent avec des scripts et styles inline.
    # Firefox applique default-src à script-src-elem et style-src-elem :
    # sans 'unsafe-inline', ThemeToggle et LoginForm ne démarrent pas.
    # Empreintes ou nonces casseraient les boots régénérés à chaque build.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.supabase.co http://127.0.0.1:54321 http://localhost:54321; base-uri 'self'; form-action 'self'"

# Même page pour chaque identifiant. Le fichier existe seulement pour l’exemple.
[[redirects]]
  from = "/verifier/*"
  to = "/verifier/00000000-0000-4000-8000-000000000019/index.html"
  status = 200

[[redirects]]
  from = "/score/*"
  to = "/score/index.html"
  status = 200

[[redirects]]
  from = "/partage/*"
  to = "/partage/index.html"
  status = 200

[[headers]]
  for = "/partage/*"
  [headers.values]
    X-Robots-Tag = "noindex"
