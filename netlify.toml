# Dev local uniquement. Aucun site lié, aucun déploiement (docs/PLAN.md §14).
[build]
  command = "pnpm build"
  publish = "apps/web/dist"

[dev]
  port = 8888
  publish = "apps/web/dist"
  autoLaunch = false
  framework = "#static"

[functions]
  # Sources : netlify/functions. Bundle complet : pnpm build:functions.
  directory = "netlify/dist/functions"
  # Fiches de correction lues à l'exécution (effort des corrections).
  included_files = ["packages/engine/fixes/fr/*.md"]

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'"
