name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # nécessaire à l'auto-commit des corrections

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Supabase CLI
        run: |
          curl -fsSL -o /tmp/supabase.tar.gz https://github.com/supabase/cli/releases/download/v2.122.0/supabase_linux_amd64.tar.gz
          sudo tar -xzf /tmp/supabase.tar.gz -C /usr/local/bin

      - name: Supabase local
        run: supabase start --yes -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Chromium
        run: pnpm --filter @audigy/web exec playwright install --with-deps chromium

      # 1) Corrections automatiques sûres (knip, Biome).
      #    Jamais sur main : on corrige sur la branche de test, puis on merge.
      # Code mort : retire seulement les exports/types inutilisés.
      # Ne supprime ni fichiers ni dépendances (--fix-type limité).
      # Un échec de knip ne bloque pas : les vérifications plus bas tranchent.
      - name: Auto-fix (knip, exports inutilisés)
        if: github.ref_name != 'main'
        run: pnpm dlx knip@5 --fix --fix-type exports,types || true

      # Ensuite : Biome remet le format propre.
      - name: Auto-fix (Biome)
        if: github.ref_name != 'main'
        run: pnpm format

      - name: Commit des corrections
        if: github.ref_name != 'main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [CI Auto-Fix] Corrections automatiques (knip, Biome)"
          branch: ${{ github.ref_name }}
          # Le token par défaut ne peut pas modifier .github/workflows
          file_pattern: '. :!.github/workflows'

      # 2) Vérifications : chacune s'exécute même si une précédente échoue,
      #    pour voir toutes les erreurs d'un coup.
      - name: guard
        id: guard
        continue-on-error: true
        run: pnpm guard

      - name: lint
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: copy-lint
        id: copy_lint
        continue-on-error: true
        run: pnpm copy-lint

      - name: typecheck
        id: typecheck
        continue-on-error: true
        run: pnpm typecheck

      - name: test
        id: test
        continue-on-error: true
        run: pnpm test

      - name: build
        id: build
        continue-on-error: true
        run: pnpm build

      - name: self-audit
        id: self_audit
        continue-on-error: true
        run: pnpm self-audit

      - name: test:ui
        id: test_ui
        continue-on-error: true
        run: pnpm test:ui

      - name: test:a11y
        id: test_a11y
        continue-on-error: true
        run: pnpm test:a11y

      # 3) Résumé : échoue si au moins une vérification a échoué.
      - name: Résumé
        if: always()
        env:
          RESULTS: >-
            guard=${{ steps.guard.outcome }}
            lint=${{ steps.lint.outcome }}
            copy-lint=${{ steps.copy_lint.outcome }}
            typecheck=${{ steps.typecheck.outcome }}
            test=${{ steps.test.outcome }}
            build=${{ steps.build.outcome }}
            self-audit=${{ steps.self_audit.outcome }}
            test:ui=${{ steps.test_ui.outcome }}
            test:a11y=${{ steps.test_a11y.outcome }}
        run: |
          failed=0
          for r in $RESULTS; do
            echo "$r"
            case "$r" in *=failure) failed=1 ;; esac
          done
          exit $failed
