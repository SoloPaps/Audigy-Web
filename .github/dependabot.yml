# Mises à jour automatiques par PR. Chaque PR doit réussir le CI avant merge :
# c'est ce qui permet de corriger sans rien casser.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # `astro check` (apps/web) ne gère pas encore TypeScript 7 : apps/web reste en 6.x.
      # À retirer quand Astro prend en charge TypeScript 7.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node doit suivre la version de Node utilisée (.nvmrc : 22).
      # La 26 décrit des API de Node 26 et casse le typecheck (JsonWebKey, etc.).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
